name: CI/CD Pipeline - Windows Server Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      enable_cd:
        description: 'Bật triển khai CD lên máy chủ vật lý (true/false)'
        required: true
        default: 'false'
        type: boolean

# Biến môi trường điều khiển triển khai CD (mặc định 'false' khi đang phát triển/chưa dựng server)
# Đổi thành 'true' khi đã cài đặt Self-Hosted Runner trên Windows Server thật.
env:
  ENABLE_CD: 'false'

jobs:
  # GIAI ĐOẠN 1: KIỂM THỬ TỰ ĐỘNG (CI)
  continuous_integration:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Thực thi Toàn bộ Test Suite (30 Tests)
        run: |
          python -m unittest discover tests

  # GIAI ĐOẠN 2: TRIỂN KHAI TỰ ĐỘNG LÊN MÁY CHỦ VẬT LÝ (CD)
  # Chỉ chạy khi:
  # 1. Nhánh main được push VÀ cờ ENABLE_CD == 'true' (hoặc trigger thủ công qua workflow_dispatch với enable_cd == true)
  # 2. Hoặc khi tạo tag phiên bản phát hành (release tag, ví dụ v1.0.0)
  continuous_deployment:
    needs: continuous_integration
    if: >
      github.ref == 'refs/heads/main' &&
      (
        env.ENABLE_CD == 'true' ||
        github.event.inputs.enable_cd == 'true' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: self-hosted  # Chạy trực tiếp trên Windows Server vật lý
    steps:
      - name: Cập nhật Mã nguồn mới nhất
        run: |
          cd D:\NLP_Production
          git fetch origin main
          git reset --hard origin/main

      - name: Đồng bộ Thư viện mới
        run: |
          cd D:\NLP_Production
          .\.venv\Scripts\Activate.ps1
          pip install -r requirements.txt

      - name: Kiểm tra trạng thái Mô hình AI
        run: |
          ollama list

      - name: Khởi động lại Windows Service
        run: |
          D:\NLP_Production\scripts\nssm.exe restart NLP_Document_Service
          Write-Host "✅ Dịch vụ NLP_Document_Service đã được cập nhật và khởi động lại thành công!"
